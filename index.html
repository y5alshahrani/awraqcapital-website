<style>
/* Layout concept: GFH-style editorial pacing — sand pages alternating with charcoal spreads,
   hairline rules, eyebrow labels, statement+italic-turn headlines, copper as the only accent — v5 guideline. */
:root{
  --copper:#A8704A; --bronze:#6E4528; --rose:#D29A7C;
  --charcoal:#2F2A28; --graphite:#3D3A38;
  --stone:#C8C1B2; --sand:#ECE9E3; --paper:#F6F4F0; --mist:#9A948D; --white:#FFFFFF;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Lato',Arial,sans-serif;
  --ar-display:'IBM Plex Sans Arabic','Sakkal Majalla',Tahoma,sans-serif;
  --ar-body:'Sakkal Majalla','IBM Plex Sans Arabic','Traditional Arabic',Tahoma,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--graphite);background:var(--sand);line-height:1.6;font-size:16px}
html[dir="rtl"] body{font-family:var(--ar-body);font-size:17.5px}
.serif{font-family:var(--serif)}
html[dir="rtl"] .serif,html[dir="rtl"] h1,html[dir="rtl"] h2{font-family:var(--ar-display);font-weight:300}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.eyebrow{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-family:var(--ar-display);font-size:13px}
.rule{border:none;border-top:.5px solid var(--graphite);opacity:.5;margin:10px 0 0}
.dark .rule{border-top-color:var(--stone)}
section{padding:88px 0}
h2.hl{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.6vw,44px);line-height:1.18;color:var(--graphite);margin:26px 0 0;text-wrap:balance}
h2.hl em{font-style:italic;display:block;color:var(--copper)}
html[dir="rtl"] h2.hl{font-family:var(--ar-display);font-weight:300;line-height:1.45}
html[dir="rtl"] h2.hl em{font-style:normal;font-weight:400}
.lead{font-weight:300;font-size:18.5px;max-width:62ch;color:var(--graphite);margin-top:18px}
html[dir="rtl"] .lead{font-weight:400}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(236,233,227,.93);backdrop-filter:blur(10px);border-bottom:.5px solid var(--stone)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px;gap:16px}
.nav img{height:44px}
.nav ul{display:flex;gap:26px;list-style:none;align-items:center;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--graphite);font-size:14px;font-weight:700}
.nav a:hover,.nav a:focus-visible{color:var(--bronze)}
.lang-btn{border:1px solid var(--copper);color:var(--copper);background:none;border-radius:2px;padding:6px 16px;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit}
.lang-btn:hover,.lang-btn:focus-visible{background:var(--bronze);color:#FFFFFF}

.cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(47,42,40,.62) 0%,rgba(47,42,40,.38) 45%,rgba(47,42,40,.86) 100%)}
.barfield{position:absolute;top:0;left:0;right:0;height:18%;background:
  repeating-linear-gradient(180deg,rgba(255,255,255,.45) 0 .75px,transparent .75px 9px);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent);pointer-events:none}
.cover .inner{position:relative;z-index:2;width:100%;max-width:1140px;margin:0 auto;padding:110px 24px 90px}
.cover-logo{height:58px;display:block;margin-bottom:46px}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,5.2vw,62px);line-height:1.14;color:var(--white);max-width:16ch;text-wrap:balance}
.cover h1 em{font-style:italic;display:block;color:var(--rose)}
html[dir="rtl"] .cover h1{font-family:var(--ar-display);font-weight:300;line-height:1.4}
html[dir="rtl"] .cover h1 em{font-style:normal;font-weight:400}
.cover .lead{color:var(--sand);max-width:52ch;font-size:18px}
.brandline{position:absolute;bottom:26px;inset-inline-start:0;width:100%;z-index:2}
.brandline .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:.5px solid rgba(200,193,178,.5);padding-top:12px;flex-wrap:wrap}
.brandline span{color:var(--stone);font-size:12.5px;letter-spacing:.08em}
html[dir="rtl"] .brandline span{letter-spacing:0;font-size:14px}
.scroll-cue{color:var(--stone);text-decoration:none;font-size:12.5px}
.scroll-cue:hover{color:var(--white)}
/* approach list */
.paths{margin-top:54px;border-top:.5px solid var(--stone)}
.path{display:grid;grid-template-columns:52px 300px 1fr;gap:26px;align-items:start;padding:30px 0;border-bottom:.5px solid var(--stone)}
.path svg{width:36px;height:36px;stroke:var(--graphite);fill:none;stroke-width:1.1}
.path h3{font-size:16.5px;font-weight:700;color:var(--graphite)}
html[dir="rtl"] .path h3{font-family:var(--ar-display)}
.path p{font-size:15px;color:var(--graphite);max-width:58ch;font-weight:300}
html[dir="rtl"] .path p{font-weight:400}
.path .tagword{display:block;margin-top:6px;color:var(--copper);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
html[dir="rtl"] .path .tagword{letter-spacing:0;font-size:13px}
/* pull statement */
.pull{margin:64px 0 0;padding:26px 0;border-top:.5px solid var(--stone);border-bottom:.5px solid var(--stone);font-family:var(--serif);font-size:clamp(20px,2.4vw,27px);font-weight:400;color:var(--graphite)}
html[dir="rtl"] .pull{font-family:var(--ar-display);font-weight:300}
.pull b{color:var(--copper);font-weight:400;font-style:italic}
html[dir="rtl"] .pull b{font-style:normal;font-weight:400}
/* stats */
.stats{background:var(--paper);border-block:.5px solid var(--stone)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;padding-block:54px}
.stat{border-inline-start:2px solid var(--stone);padding-inline-start:18px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;color:var(--graphite);font-variant-numeric:tabular-nums}
.stat b small{font-size:55%}
.stat span{display:block;margin-top:9px;font-size:12px;color:var(--mist);letter-spacing:.05em}
html[dir="rtl"] .stat span{letter-spacing:0;font-size:13.5px}
/* dark spreads */
.dark{background:var(--charcoal);color:var(--sand)}
.dark h2.hl{color:var(--white)}
.dark h2.hl em{color:var(--rose)}
.dark .lead{color:var(--sand)}
.dark .eyebrow{color:var(--rose)}
/* model stages */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:56px}
.stage{border-top:.5px solid rgba(200,193,178,.45);padding-top:22px}
.stage .num{width:40px;height:40px;border-radius:50%;background:var(--copper);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:16px;font-family:var(--sans)}
.stage h3{font-size:16px;font-weight:700;color:var(--white);margin-bottom:8px}
html[dir="rtl"] .stage h3{font-family:var(--ar-display)}
.stage p{font-size:14px;font-weight:300;color:var(--sand)}
html[dir="rtl"] .stage p{font-weight:400}
.stage .fee{display:block;margin-top:10px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .stage .fee{letter-spacing:0;font-size:13px}
/* track record */
.mandates{margin-top:52px;border-top:.5px solid var(--stone)}
.mandate{display:grid;grid-template-columns:120px 1fr 150px;gap:24px;align-items:baseline;padding:26px 0;border-bottom:.5px solid var(--stone)}
.mandate .yr{font-family:var(--serif);font-size:34px;color:var(--copper);font-variant-numeric:tabular-nums}
.mandate h3{font-size:16px;font-weight:700;color:var(--graphite)}
html[dir="rtl"] .mandate h3{font-family:var(--ar-display)}
.mandate p{font-size:14.5px;font-weight:300;color:var(--graphite);margin-top:4px}
html[dir="rtl"] .mandate p{font-weight:400}
.mandate .status{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);text-align:end}
html[dir="rtl"] .mandate .status{letter-spacing:0;font-size:13px}
.consent{margin-top:16px;font-size:12px;color:var(--mist)}
/* insights */
.insights-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;margin-top:52px}
.video-ph{background:var(--charcoal);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.video-ph .play{width:62px;height:62px;border-radius:50%;background:var(--copper);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:20px}
.video-ph span{color:var(--stone);font-size:13px;padding:0 20px;text-align:center}
.arts{display:flex;flex-direction:column;justify-content:center}
.art{display:block;text-decoration:none;color:var(--graphite);padding:20px 0;border-bottom:.5px solid var(--stone)}
.art:first-child{border-top:.5px solid var(--stone)}
.art .cat{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .art .cat{letter-spacing:0;font-size:12.5px}
.art h4{font-size:16px;font-weight:400;font-family:var(--serif);margin-top:6px}
html[dir="rtl"] .art h4{font-family:var(--ar-display)}
.art:hover h4{color:var(--copper)}
/* leadership */
.lead-grid{display:grid;grid-template-columns:300px 1fr;gap:54px;align-items:start;margin-top:52px}
.portrait{background:var(--stone);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--charcoal)}
.portrait .ph{width:86px;height:86px;border-radius:50%;border:1px solid var(--charcoal);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px}
.portrait figcaption{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--graphite);padding:0 16px;text-align:center}
.lead-grid h3{font-size:22px;font-weight:700;color:var(--graphite)}
html[dir="rtl"] .lead-grid h3{font-family:var(--ar-display)}
.lead-grid .title{color:var(--mist);font-size:13.5px;margin:4px 0 18px}
.lead-grid .bio{font-weight:300;font-size:15.5px;max-width:62ch}
html[dir="rtl"] .lead-grid .bio{font-weight:400}
.boards{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 26px;font-size:12.5px;color:var(--mist)}
.boards b{color:var(--copper);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
html[dir="rtl"] .boards b{letter-spacing:0;font-size:12.5px}
/* next step */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:54px}
.fstep{text-align:center}
.fstep .dot{width:52px;height:52px;border-radius:50%;background:var(--copper);color:var(--white);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-weight:700;font-family:var(--sans)}
.fstep h4{font-size:14.5px;font-weight:700;color:var(--white)}
html[dir="rtl"] .fstep h4{font-family:var(--ar-display)}
.cta-row{margin-top:54px;text-align:center}
.cta{display:inline-block;background:var(--copper);color:var(--white);text-decoration:none;padding:15px 38px;font-weight:700;font-size:15px;letter-spacing:.04em;border-radius:2px}
.cta:hover{background:var(--bronze)}
html[dir="rtl"] .cta{letter-spacing:0}
/* footer */
footer{background:var(--charcoal);color:var(--mist);padding:56px 0 40px;font-size:13px}
footer .top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start}
footer img{height:42px}
.contact{border-inline-start:1px solid var(--stone);padding-inline-start:18px;max-width:340px}
.contact b{color:var(--sand);display:block;margin-bottom:6px;font-size:14px}
.contact .pre{color:var(--stone)}
.disclosure{margin-top:36px;padding-top:14px;border-top:.5px solid rgba(200,193,178,.35);font-size:10.5px;color:var(--mist);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media(max-width:920px){
  .stats .wrap{grid-template-columns:repeat(2,1fr)}
  .stages,.flow{grid-template-columns:repeat(2,1fr)}
  .path{grid-template-columns:44px 1fr;grid-template-rows:auto auto}
  .path p{grid-column:2}
  .insights-grid,.lead-grid{grid-template-columns:1fr}
  .mandate{grid-template-columns:90px 1fr}
  .mandate .status{grid-column:2;text-align:start}
  .nav ul{display:none}
  .nav .lang-only{display:block}
  .cover{min-height:88vh}
}
</style>
