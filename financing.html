  --sans:'Lato',Arial,sans-serif;
  --ar-display:'IBM Plex Sans Arabic','Lato','Sakkal Majalla',Tahoma,sans-serif;
  --ar-body:'IBM Plex Sans Arabic','Lato','Sakkal Majalla',Tahoma,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --hdr:70px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--graphite);background:var(--sand);line-height:1.6;font-size:16px;overflow-x:hidden;font-variant-numeric:lining-nums}
html[dir="rtl"] body{font-family:var(--ar-body);font-size:16.5px;line-height:1.8}
img,svg{display:block;max-width:100%}
button,input{font-family:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{position:relative;padding:104px 0}
.dark{background:var(--charcoal);color:var(--sand)}
.paper{background:var(--paper)}

/* type */
.eyebrow{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cap)}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-family:var(--ar-display);font-size:13.5px}
.dark .eyebrow{color:var(--rose)}
.rule{border:none;height:1px;background:var(--graphite);opacity:.45;margin:10px 0 0;transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease)}
html[dir="rtl"] .rule{transform-origin:right}
.in>.rule,.rule.in{transform:scaleX(1)}
.dark .rule{background:var(--stone)}
h1,h2,h3,h4{font-weight:400}
h2.hl{font-family:var(--serif);font-size:clamp(30px,3.7vw,46px);line-height:1.16;color:var(--graphite);margin:26px 0 0;text-wrap:balance;max-width:24ch}
h2.hl em{font-style:italic;display:block;color:var(--copper)}
html[dir="rtl"] h2.hl{font-family:var(--ar-display);font-weight:300;line-height:1.45;max-width:28ch}
html[dir="rtl"] h2.hl em{font-style:normal;font-weight:400}
.dark h2.hl{color:var(--white)}
.dark h2.hl em{color:var(--rose)}
.lead{font-weight:300;font-size:18.5px;max-width:60ch;margin-top:18px}
html[dir="rtl"] .lead{font-weight:400;font-size:18px}
.dark .lead{color:var(--sand)}
.fine{font-size:12.5px;color:var(--cap);max-width:80ch}
html[dir="rtl"] .fine{font-size:13.5px}
.dark .fine{color:var(--stone);opacity:.85}

/* reveal */
.js [data-r]{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.js [data-r].in{opacity:1;transform:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;padding:14px 26px;font-weight:700;font-size:14px;letter-spacing:.04em;border-radius:2px;border:1px solid var(--copper);background:var(--copper);color:var(--white);cursor:pointer;transition:background .25s,border-color .25s,color .25s,transform .25s}
.btn:hover,.btn:focus-visible{background:var(--bronze);border-color:var(--bronze)}
.btn.ghost{background:transparent;border-color:rgba(200,193,178,.7);color:var(--white)}
.btn.ghost:hover,.btn.ghost:focus-visible{border-color:var(--rose);color:var(--rose);background:transparent}
.btn.line{background:transparent;color:var(--bronze)}
.btn.line:hover,.btn.line:focus-visible{background:var(--bronze);color:var(--white)}
.btn .arr{display:inline-block;transition:transform .25s}
.btn:hover .arr{transform:translateX(4px)}
html[dir="rtl"] .btn{letter-spacing:0;font-size:15.5px}
html[dir="rtl"] .btn .arr{transform:scaleX(-1)}
html[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}

/* header */
.top{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hdr);display:flex;align-items:center;gap:22px;padding:0 28px;transition:background .35s,border-color .35s;border-bottom:1px solid transparent}
.top .logo{position:relative;display:block;height:50px;aspect-ratio:520/201;flex:none}
.top .logo img{position:absolute;inset:0;height:100%;width:auto;transition:opacity .35s}
.top .l-dark{opacity:0}
.top nav{display:flex;gap:24px;margin-inline-start:auto}
.top nav a{text-decoration:none;font-size:13.5px;font-weight:700;color:var(--sand);opacity:.9;transition:color .25s,opacity .25s}
html[dir="rtl"] .top nav a{font-size:15px;font-weight:400}
.top nav a:hover{opacity:1;color:var(--rose)}
.top .hbtn{padding:9px 16px;font-size:12.5px}
.lang-btn{border:1px solid var(--rose);color:var(--rose);background:none;border-radius:2px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;transition:background .25s,color .25s,border-color .25s}
.lang-btn:hover{background:var(--copper);border-color:var(--copper);color:#fff}
.top.solid{background:rgba(236,233,227,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom-color:var(--stone)}
.top.solid .l-light{opacity:0}.top.solid .l-dark{opacity:1}
.top.solid nav a{color:var(--graphite)}
.top.solid nav a:hover{color:var(--bronze)}
.top.solid .lang-btn{border-color:var(--copper);color:var(--bronze)}
.top.solid .lang-btn:hover{color:#fff}
.prog{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;pointer-events:none}
.prog i{display:block;height:100%;background:var(--copper);transform-origin:left;transform:scaleX(0)}
html[dir="rtl"] .prog i{transform-origin:right}

/* hero */
.hero{min-height:100vh;min-height:100svh;padding:calc(var(--hdr) + 40px) 0 96px;display:flex;align-items:center;overflow:hidden}
.barfield{position:absolute;top:0;left:0;right:0;height:22%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.28) 0 .75px,transparent .75px 9px);-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);mask-image:linear-gradient(180deg,#000 40%,transparent);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;width:100%}
.hero h1{font-family:var(--serif);font-size:clamp(34px,4.1vw,54px);line-height:1.14;color:var(--white);margin-top:26px}
.hero h1 .rot{display:block;color:var(--rose);height:1.2em;overflow:hidden;white-space:nowrap}
.hero h1 .rot span{transform-origin:left bottom}
html[dir="rtl"] .hero h1 .rot span{transform-origin:right bottom}
.hero h1 .rot span{display:inline-block;transition:transform .6s var(--ease),opacity .6s var(--ease)}
.hero h1 .rot span.out{transform:translateY(-70%);opacity:0}
.hero h1 .rot span.pre{transform:translateY(70%);opacity:0;transition:none}
.hero h1 em{font-style:italic;display:block;color:var(--rose)}
html[dir="rtl"] .hero h1{font-family:var(--ar-display);font-weight:300;line-height:1.42;font-size:clamp(30px,3.8vw,50px)}
html[dir="rtl"] .hero h1 em{font-style:normal;font-weight:400}
html[dir="rtl"] .hero h1 .rot{height:1.5em}
.hero .lead{max-width:50ch}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.brandline{position:absolute;bottom:24px;left:0;right:0}
.brandline .wrap>div{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid rgba(200,193,178,.35);padding-top:12px;flex-wrap:wrap}
.brandline span,.brandline a{color:var(--stone);font-size:12.5px;letter-spacing:.08em;text-decoration:none}
html[dir="rtl"] .brandline span,html[dir="rtl"] .brandline a{letter-spacing:0;font-size:14px}
.brandline a:hover{color:var(--white)}
.brandline a i{display:inline-block;font-style:normal;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* hero art — the capital stack */
.stack{position:relative}
.stack svg{width:100%;height:auto;overflow:visible}
.stack .slab{transform:translateY(calc(var(--ex,0)*var(--k,0)*-1px));transition:opacity .35s}
.stack .slab>g{opacity:0;transform:translateY(-70px);animation:drop .9s var(--ease) forwards;animation-delay:calc(var(--k)*110ms + 350ms)}
@keyframes drop{to{opacity:1;transform:none}}
.stack[data-hl] .slab{opacity:.22}
.stack[data-hl="land"] .slab[data-g="land"],.stack[data-hl="eq"] .slab[data-g="eq"],.stack[data-hl="fin"] .slab[data-g="fin"]{opacity:1}
.stack .grid path{stroke:rgba(200,193,178,.16);stroke-width:1;fill:none}
.legend{list-style:none;display:grid;gap:10px;margin-top:6px}
.legend li{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start;padding:10px 12px;border-inline-start:1px solid rgba(200,193,178,.3);cursor:default;transition:background .25s,border-color .25s}
.legend li:hover{background:rgba(255,255,255,.04);border-color:var(--rose)}
.legend i{width:14px;height:14px;margin-top:5px;border-radius:1px}
.legend b{display:block;font-weight:700;font-size:14px;color:var(--white)}
.legend span{display:block;font-size:13px;color:var(--stone);font-weight:300}
html[dir="rtl"] .legend b{font-size:15.5px;font-weight:500}
html[dir="rtl"] .legend span{font-size:14.5px;font-weight:400}

/* stats */
.stats{background:var(--paper);border-block:1px solid var(--stone);padding:0}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;padding-block:52px}
.stat{border-inline-start:2px solid var(--stone);padding-inline-start:18px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:46px;line-height:1;color:var(--graphite);font-variant-numeric:lining-nums tabular-nums}
.stat b small{font-size:50%;color:var(--copper)}
.stat>span{display:block;margin-top:10px;font-size:13px;color:var(--cap)}
html[dir="rtl"] .stat>span{font-size:14.5px}

/* project type selector */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:52px}
.type{position:relative;text-align:start;background:var(--paper);border:1px solid transparent;border-top:2px solid var(--stone);padding:20px 20px 18px;cursor:pointer;transition:background .3s,border-color .3s,transform .3s var(--ease),box-shadow .3s}
.type:hover{transform:translateY(-4px);background:var(--white)}
.type[aria-pressed="true"]{background:var(--white);border-top-color:var(--copper);box-shadow:0 18px 40px -26px rgba(47,42,40,.45)}
.type svg{width:100%;height:auto;stroke:var(--graphite);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.type[aria-pressed="true"] svg{stroke:var(--copper)}
.type svg *{stroke-dasharray:1;stroke-dashoffset:0}
.type.draw svg *{animation:draw 1.5s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.type .cat{display:block;margin-top:14px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--copper)}
html[dir="rtl"] .type .cat{letter-spacing:0;font-size:12.5px}
.type h3{font-family:var(--serif);font-size:21px;line-height:1.25;margin-top:4px}
html[dir="rtl"] .type h3{font-family:var(--ar-display);line-height:1.5;font-size:20px}
.tpanel{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;margin-top:22px;background:var(--white);padding:34px 34px 30px;border-inline-start:2px solid var(--copper)}
.tpanel .say{font-family:var(--serif);font-size:clamp(20px,2.2vw,26px);line-height:1.32;color:var(--graphite)}
html[dir="rtl"] .tpanel .say{font-family:var(--ar-display);font-weight:300;line-height:1.6;font-size:clamp(19px,2vw,23px)}
.tpanel dl{display:grid;gap:18px}
.tpanel dt{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cap)}
html[dir="rtl"] .tpanel dt{letter-spacing:0;font-size:13px}
.tpanel dd{margin-top:5px;font-size:15px;font-weight:300}
html[dir="rtl"] .tpanel dd{font-weight:400;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--copper);background:none;color:var(--bronze);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:40px;cursor:pointer;transition:background .25s,color .25s}
.chip:hover{background:var(--copper);color:#fff}
html[dir="rtl"] .chip{font-size:14px;font-weight:500}
.tpanel .go{display:inline-block;margin-top:22px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);text-decoration:none;border-bottom:1px solid var(--copper);padding-bottom:3px}
html[dir="rtl"] .tpanel .go{letter-spacing:0;font-size:14.5px}
.swap{animation:swap .55s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* pinned scroll scenes */
.pin{padding:0}
.pin-track{position:relative}
.pin-stick{position:sticky;top:0;height:100vh;display:flex;align-items:center;padding-top:var(--hdr);overflow:hidden}
.pin.nopin .pin-track{height:auto !important}
.pin.nopin .pin-stick{position:static;height:auto;padding:96px 0}
.two{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center;width:100%}
.steps{list-style:none;margin-top:30px;display:grid;gap:2px}
.steps li{padding:14px 0 14px 20px;padding-inline:20px 0;border-inline-start:1px solid rgba(200,193,178,.3);opacity:.38;transition:opacity .45s,border-color .45s}
.steps li.on{opacity:1;border-inline-start-color:var(--rose)}
.steps h3{font-size:16.5px;font-weight:700;color:var(--white)}
html[dir="rtl"] .steps h3{font-family:var(--ar-display);font-weight:500;font-size:17.5px}
.steps p{font-size:14.5px;font-weight:300;color:var(--sand);max-width:46ch;display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.steps p>span{overflow:hidden}
.steps li.on p{grid-template-rows:1fr}
html[dir="rtl"] .steps p{font-weight:400;font-size:15.5px}
.nopin .steps li{opacity:1;border-inline-start-color:var(--rose)}
.nopin .steps p{grid-template-rows:1fr}
.light .steps li{border-inline-start-color:var(--stone)}
.light .steps li.on,.light.nopin .steps li{border-inline-start-color:var(--copper)}
.light .steps h3{color:var(--graphite)}
.light .steps p{color:var(--graphite)}

/* scene: which side of the table */
.tbl{position:relative;width:100%;max-width:600px;aspect-ratio:10/7.4;margin-inline:auto;container-type:inline-size}
.tbl .pt{position:absolute;width:0;height:0}
.tbl .pt>*{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.tbl .you{inset-inline-start:19%;top:32%}
.tbl .you>div{width:27cqw;height:27cqw;border-radius:50%;border:1px solid var(--stone);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.04)}
.tbl .you b{font-family:var(--serif);font-size:clamp(13px,3.3cqw,20px);color:var(--white);font-weight:400}
html[dir="rtl"] .tbl .you b{font-family:var(--ar-display)}
.tbl .you span{font-size:clamp(9.5px,2cqw,12px);color:var(--stone);margin-top:2px}
.tbl .ring{inset-inline-start:19%;top:50%}
.tbl .ring>div{width:35cqw;height:66cqw;border:1px dashed var(--rose);border-radius:20cqw;opacity:0;transform:translate(-50%,-50%) scale(.9);transition:opacity .6s,transform .8s var(--ease)}
.tbl .ring>div::after{content:attr(data-cap);position:absolute;bottom:-2.3em;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(10px,2.1cqw,12.5px);letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700}
html[dir="rtl"] .tbl .ring>div::after{letter-spacing:0;font-size:clamp(11px,2.4cqw,14px)}
.tbl .mid{position:absolute;inset-inline-start:50%;top:6%;bottom:6%;width:1px;background:linear-gradient(180deg,transparent,var(--stone) 12%,var(--stone) 88%,transparent);opacity:.55}
.tbl .midcap{inset-inline-start:50%;top:3%}
.tbl .midcap>span{white-space:nowrap;font-size:clamp(9.5px,2cqw,11.5px);letter-spacing:.2em;text-transform:uppercase;color:var(--stone);background:var(--charcoal);padding:0 8px}
html[dir="rtl"] .tbl .midcap>span{letter-spacing:0;font-size:clamp(10.5px,2.3cqw,13.5px)}
.tbl .aw{inset-inline-start:50%;top:52%;transition:inset-inline-start 1s var(--ease),top 1s var(--ease);z-index:2}
.tbl .aw>div{width:17cqw;height:17cqw;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;transition:background .8s,box-shadow .8s;overflow:hidden}
.tbl .aw>div i{display:block;width:100%;height:100%;background:repeating-linear-gradient(180deg,transparent 0 6%,rgba(47,42,40,.35) 6% 9.5%);opacity:0;transition:opacity .8s}
.tbl .awcap{inset-inline-start:50%;top:68%;transition:inset-inline-start 1s var(--ease),top 1s var(--ease);z-index:2}
.tbl .awcap>span{white-space:nowrap;text-align:center;background:var(--charcoal);padding:2px 8px;font-size:clamp(10px,2.2cqw,13px);color:var(--stone);font-weight:700}
html[dir="rtl"] .tbl .awcap>span{font-size:clamp(11px,2.5cqw,14.5px);font-weight:500}
.tbl .awcap .b{display:none;color:var(--rose)}
.tbl .fee{position:absolute;top:52%;height:1px;border-top:1px dashed var(--stone);opacity:.6;transition:opacity .5s}
.tbl .fee.l{inset-inline-start:33%;width:8%}
.tbl .fee.r{inset-inline-start:59%;width:9%}
.tbl .fi{inset-inline-start:81%}
.tbl .fi>span{white-space:nowrap;text-align:center;width:24cqw;font-size:clamp(9.5px,2.2cqw,13px);padding:.55em .3em;border:1px solid rgba(200,193,178,.4);color:var(--stone);border-radius:40px;transition:border-color .5s,color .5s,background .5s;transition-delay:calc(var(--n)*90ms)}
html[dir="rtl"] .tbl .fi>span{font-size:clamp(10.5px,2.4cqw,14px)}
.tbl .ln{position:absolute;inset-inline-start:38.5%;width:30.5%;height:1px;background:var(--rose);transform:scaleX(0);transform-origin:right;transition:transform .9s var(--ease);transition-delay:calc(var(--n)*90ms)}
html[dir="rtl"] .tbl .ln{transform-origin:left}
.tbl[data-step="1"] .aw,.tbl[data-step="2"] .aw{inset-inline-start:19%;top:66%}
.tbl[data-step="1"] .awcap,.tbl[data-step="2"] .awcap{inset-inline-start:19%;top:81%}
.tbl[data-step="1"] .aw>div,.tbl[data-step="2"] .aw>div{background:linear-gradient(180deg,var(--rose),var(--copper));box-shadow:0 0 0 6px rgba(210,154,124,.14)}
.tbl[data-step="1"] .aw i,.tbl[data-step="2"] .aw i{opacity:1}
.tbl[data-step="1"] .awcap .a,.tbl[data-step="2"] .awcap .a{display:none}
.tbl[data-step="1"] .awcap .b,.tbl[data-step="2"] .awcap .b{display:inline}
.tbl[data-step="1"] .ring>div,.tbl[data-step="2"] .ring>div{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tbl[data-step="1"] .fee,.tbl[data-step="2"] .fee{opacity:0}
.tbl[data-step="2"] .fi>span{border-color:var(--rose);color:var(--white);background:rgba(210,154,124,.1)}
.tbl[data-step="2"] .ln{transform:scaleX(1)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.pillar{border-top:1px solid rgba(200,193,178,.4);padding-top:20px}
.pillar svg{width:34px;height:34px;stroke:var(--rose);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.pillar h3{font-size:16px;font-weight:700;color:var(--white);margin-top:14px}
html[dir="rtl"] .pillar h3{font-family:var(--ar-display);font-weight:500;font-size:17px}
.pillar p{font-size:14px;font-weight:300;color:var(--sand);margin-top:6px}
html[dir="rtl"] .pillar p{font-weight:400;font-size:15px}

/* marquee */
.marq{background:var(--sand);padding:44px 0 0;overflow:hidden;white-space:nowrap}
.marq div{display:inline-block;font-family:var(--serif);font-style:italic;font-size:clamp(38px,6vw,84px);line-height:1.2;color:var(--stone);will-change:transform}
html[dir="rtl"] .marq div{font-family:var(--ar-display);font-style:normal;font-weight:300;line-height:1.5}
.marq b{font-weight:400;color:var(--copper)}

/* tools explorer */
.tools{display:grid;grid-template-columns:.9fr 1.25fr;gap:34px;margin-top:52px;align-items:start}
.tlist{display:grid;border-top:1px solid var(--stone)}
.tbtn{display:grid;grid-template-columns:38px 1fr 18px;gap:10px;align-items:center;text-align:start;background:none;border:none;border-bottom:1px solid var(--stone);padding:17px 6px;cursor:pointer;transition:background .25s,padding .3s var(--ease)}
.tbtn:hover{background:var(--paper)}
.tbtn .n{font-family:var(--serif);font-size:20px;color:var(--mist);font-variant-numeric:lining-nums tabular-nums;transition:color .25s}
.tbtn b{display:block;font-size:16px;font-weight:700}
html[dir="rtl"] .tbtn b{font-family:var(--ar-display);font-weight:500;font-size:17px}
.tbtn span.s{display:block;font-size:13px;color:var(--cap);font-weight:400}
html[dir="rtl"] .tbtn span.s{font-size:14px}
.tbtn .fit{display:none;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin-top:3px}
html[dir="rtl"] .tbtn .fit{letter-spacing:0;font-size:12px}
.tbtn.fits .fit{display:block}
.tbtn .ar{color:var(--copper);opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s}
html[dir="rtl"] .tbtn .ar{transform:scaleX(-1) translateX(-6px)}
.tbtn[aria-selected="true"]{background:var(--white);padding-inline:16px 10px}
.tbtn[aria-selected="true"] .n{color:var(--copper)}
.tbtn[aria-selected="true"] .ar{opacity:1;transform:none}
html[dir="rtl"] .tbtn[aria-selected="true"] .ar{transform:scaleX(-1)}
.tdet{background:var(--charcoal);color:var(--sand);padding:36px 36px 30px;position:sticky;top:calc(var(--hdr) + 20px)}
.tdet .kind{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .tdet .kind{letter-spacing:0;font-size:13px}
.tdet h3{font-family:var(--serif);font-size:30px;line-height:1.2;color:var(--white);margin-top:8px}
html[dir="rtl"] .tdet h3{font-family:var(--ar-display);font-weight:300;line-height:1.5;font-size:27px}
.tdet .desc{font-weight:300;font-size:15.5px;margin-top:10px;max-width:54ch}
html[dir="rtl"] .tdet .desc{font-weight:400;font-size:16px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(200,193,178,.3)}
.meter label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--stone)}
html[dir="rtl"] .meter label{font-size:13.5px}
.meter label em{font-style:normal;color:var(--white);font-weight:700}
.meter .segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.meter .segs i{height:7px;background:rgba(200,193,178,.2);position:relative;overflow:hidden}
.meter .segs i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--copper),var(--rose));transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);transition-delay:calc(var(--n)*70ms)}
html[dir="rtl"] .meter .segs i::after{transform-origin:right;background:linear-gradient(270deg,var(--copper),var(--rose))}
.meter .segs i.f::after{transform:scaleX(1)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 30px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(200,193,178,.3)}
.facts dt{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .facts dt{letter-spacing:0;font-size:13px}
.facts dd{font-size:14.5px;font-weight:300;margin-top:4px}
html[dir="rtl"] .facts dd{font-weight:400;font-size:15.5px}
.tdet .best{margin-top:24px;font-size:13px;color:var(--stone)}
.tdet .best b{color:var(--white);font-weight:700}
html[dir="rtl"] .tdet .best{font-size:14.5px}
.tools-note{margin-top:30px}

/* scene: how the capital comes together */
.str{position:relative;width:100%;font-size:13.5px}
html[dir="rtl"] .str{font-size:14.5px}
.str-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pcard{position:relative;background:var(--white);border-top:2px solid var(--stone);padding:14px 14px 16px;opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease),border-color .5s,box-shadow .5s;transition-delay:calc(var(--n,0)*90ms)}
.pcard b{display:block;font-weight:700;font-size:1.04em;color:var(--graphite)}
html[dir="rtl"] .pcard b{font-family:var(--ar-display);font-weight:500}
.pcard span{display:block;font-weight:300;color:var(--graphite);margin-top:3px;line-height:1.4}
html[dir="rtl"] .pcard span{font-weight:400;line-height:1.6}
.pcard.awc{border-top-color:var(--copper);background:var(--charcoal)}
.pcard.awc b{color:var(--white)}.pcard.awc span{color:var(--sand)}
.pcard .tag{display:inline-block;font-style:normal;font-size:.76em;font-weight:700;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:var(--white);background:var(--copper);padding:3px 7px;border-radius:2px;margin-top:10px;opacity:0;transform:scale(.8);transition:opacity .5s,transform .5s var(--ease)}
html[dir="rtl"] .pcard .tag{letter-spacing:0;font-size:.86em;font-weight:500}
.bus{position:relative;height:34px}
.bus i{position:absolute;background:var(--copper);transition:transform .6s var(--ease)}
.bus .d{top:0;width:1px;height:50%;transform:scaleY(0);transform-origin:top}
.bus .d1{inset-inline-start:12.5%}.bus .d2{inset-inline-start:37.5%}.bus .d3{inset-inline-start:62.5%}.bus .d4{inset-inline-start:87.5%}
.bus .h{top:50%;inset-inline:12.5%;height:1px;transform:scaleX(0);transition-delay:.25s}
.bus .c{top:50%;inset-inline-start:50%;width:1px;height:50%;transform:scaleY(0);transform-origin:top;transition-delay:.55s}
.bus.b2 .c{top:0;transition-delay:0s}
.bus.b2 .h{inset-inline:20%;transition-delay:.25s}
.bus.b2 .d{top:50%;transition-delay:.55s}
.bus.b2 .d1{inset-inline-start:20%}.bus.b2 .d2{inset-inline-start:80%}
.fundbox{background:var(--copper);color:var(--white);padding:16px 20px;text-align:center;opacity:0;transform:scale(.94);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:.5s;max-width:520px;margin-inline:auto}
.fundbox b{display:block;font-family:var(--serif);font-size:1.5em;font-weight:400}
html[dir="rtl"] .fundbox b{font-family:var(--ar-display);font-size:1.3em}
.fundbox span{display:block;font-weight:300;opacity:.95}
html[dir="rtl"] .fundbox span{font-weight:400}
.str-row.r2{grid-template-columns:40% 20% 40%;gap:0;align-items:center}
.str-row.r2 .fin{grid-column:1;grid-row:1}.str-row.r2 .asset{grid-column:3;grid-row:1}
.flowcap{grid-column:2;grid-row:1;text-align:center;font-size:.8em;font-weight:700;color:var(--bronze);padding:0 8px;line-height:1.3;opacity:0;transition:opacity .6s .3s}
.flowcap::before{content:"";display:block;height:1px;margin:0 auto 7px;background:repeating-linear-gradient(90deg,var(--copper) 0 7px,transparent 7px 13px);background-size:13px 1px;animation:flow 1s linear infinite}
html[dir="rtl"] .flowcap::before{animation-direction:reverse}
@keyframes flow{to{background-position:-13px 0}}
.str[data-step] .str-row.r1 .pcard{opacity:1;transform:none}
.str:is([data-step="1"],[data-step="2"],[data-step="3"],[data-step="4"]) .pcard .tag{opacity:1;transform:none}
.str:is([data-step="2"],[data-step="3"],[data-step="4"]) .bus.b1 i{transform:none}
.str:is([data-step="2"],[data-step="3"],[data-step="4"]) .fundbox{opacity:1;transform:none}
.str:is([data-step="3"],[data-step="4"]) .bus.b2 .c,.str:is([data-step="3"],[data-step="4"]) .bus.b2 .h,.str:is([data-step="3"],[data-step="4"]) .bus.b2 .d1{transform:none}
.str:is([data-step="3"],[data-step="4"]) .pcard.fin{opacity:1;transform:none}
.str[data-step="4"] .bus.b2 .d2{transform:none}
.str[data-step="4"] .pcard.asset{opacity:1;transform:none}
.str[data-step="4"] .flowcap{opacity:1}
.str[data-step="4"] .pcard.asset{border-top-color:var(--copper);box-shadow:0 16px 36px -24px rgba(47,42,40,.5)}

/* timeline */
.tl{display:grid;grid-template-columns:.82fr 1.3fr;gap:50px;align-items:center;width:100%}
.tl-head h2.hl{margin-top:20px;font-size:clamp(28px,3vw,38px)}
.phase{margin-top:24px;min-height:330px}
.phase .wk{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .phase .wk{letter-spacing:0;font-size:13.5px}
.phase h3{font-family:var(--serif);font-size:26px;color:var(--white);margin-top:4px;line-height:1.25}
html[dir="rtl"] .phase h3{font-family:var(--ar-display);font-weight:300;line-height:1.5;font-size:24px}
.phase h4{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);margin-top:16px}
html[dir="rtl"] .phase h4{letter-spacing:0;font-size:13px}
.phase ul{list-style:none;margin-top:6px;display:grid;gap:3px}
.phase li{position:relative;padding-inline-start:16px;font-size:14px;font-weight:300;color:var(--sand)}
html[dir="rtl"] .phase li{font-weight:400;font-size:15px}
.phase li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:7px;height:1px;background:var(--rose)}
.phase ul.del li{font-weight:700;color:var(--white)}
html[dir="rtl"] .phase ul.del li{font-weight:500}
.phase ul.del li::before{width:6px;height:6px;top:.5em;background:var(--copper);transform:rotate(45deg)}
.gantt{--T:18;position:relative;background:rgba(255,255,255,.035);border:1px solid rgba(200,193,178,.22);padding:20px 22px 18px}
.g-grid{display:grid;grid-template-columns:150px 1fr;gap:0 14px;align-items:center}
.g-months,.g-weeks{display:grid;grid-template-columns:repeat(var(--T),1fr)}
.g-months span{grid-column:span 4;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);padding:0 0 6px;border-inline-start:1px solid rgba(200,193,178,.3);padding-inline-start:6px}
.g-months span:last-child{grid-column:span 2;color:var(--rose)}
html[dir="rtl"] .g-months span{letter-spacing:0;font-size:12px}
.g-weeks span{font-size:10.5px;color:var(--mist);text-align:center;padding:5px 0;border-top:1px solid rgba(200,193,178,.25);font-variant-numeric:lining-nums tabular-nums;transition:color .3s}
.g-weeks span.past{color:var(--white)}
.g-lbl{background:none;border:none;text-align:start;cursor:pointer;font-size:13px;font-weight:700;color:var(--stone);padding:6px 0;display:flex;gap:8px;align-items:baseline;transition:color .3s}
html[dir="rtl"] .g-lbl{font-size:14px;font-weight:500}
.g-lbl i{font-style:normal;font-family:var(--serif);color:var(--mist);font-size:15px;transition:color .3s}
.g-lbl.on{color:var(--white)}.g-lbl.on i{color:var(--rose)}
.g-lbl.static{cursor:default;color:var(--rose);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
html[dir="rtl"] .g-lbl.static{letter-spacing:0;font-size:12.5px}
.g-lane{position:relative;height:40px;border-top:1px solid rgba(200,193,178,.12);background-image:linear-gradient(90deg,rgba(200,193,178,.09) 1px,transparent 1px);background-size:calc(100%/var(--T)) 100%}
html[dir="rtl"] .g-lane{background-position:right top;background-image:linear-gradient(270deg,rgba(200,193,178,.09) 1px,transparent 1px)}
.g-bar,.g-buf{position:absolute;top:11px;height:18px;inset-inline-start:calc(var(--s)/var(--T)*100%);width:calc((var(--e) - var(--s))/var(--T)*100%)}
.g-bar{background:rgba(200,193,178,.16);overflow:hidden;border-radius:1px}
.g-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--copper),var(--rose));transform:scaleX(var(--f,0));transform-origin:left}
html[dir="rtl"] .g-bar::after{transform-origin:right;background:linear-gradient(270deg,var(--copper),var(--rose))}
.g-buf{top:16px;height:8px;background:repeating-linear-gradient(135deg,rgba(210,154,124,.4) 0 3px,transparent 3px 6px)}
.g-bar.tail{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);overflow:visible}
html[dir="rtl"] .g-bar.tail{clip-path:polygon(100% 0,10px 0,0 50%,10px 100%,100% 100%)}
.g-ms{position:absolute;top:8px;inset-inline-start:calc(var(--at)/var(--T)*100%);width:0}
.g-ms i{position:absolute;left:-6px;top:0;width:12px;height:12px;transform:rotate(45deg) scale(.7);background:var(--charcoal);border:1px solid var(--stone);transition:background .35s,border-color .35s,transform .35s var(--ease)}
.g-ms b{position:absolute;top:17px;left:0;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--mist);white-space:nowrap;transition:color .35s}
.g-ms.hit i{background:var(--rose);border-color:var(--rose);transform:rotate(45deg) scale(1)}
.g-ms.hit b{color:var(--white)}
.g-lane.ms{height:46px}
.g-now{position:absolute;top:0;bottom:0;inset-inline-start:calc(var(--w,0)/var(--T)*100%);width:1px;background:var(--white);opacity:.75;pointer-events:none}
.g-weeks{position:relative}
.g-weeks .g-now::before{content:"";position:absolute;top:-4px;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--white)}
.g-note{margin-top:14px;font-size:12px;color:var(--stone);display:flex;gap:18px;flex-wrap:wrap}
html[dir="rtl"] .g-note{font-size:13.5px}
.g-note span::before{content:"";display:inline-block;width:8px;height:8px;margin-inline-end:7px;vertical-align:middle}
.g-note .k1::before{background:var(--rose);transform:rotate(45deg)}
.g-note .k2::before{width:16px;background:repeating-linear-gradient(135deg,rgba(210,154,124,.6) 0 3px,transparent 3px 6px)}
.phase-list{display:none}
.nopin .phase{display:none}
.nopin .phase-list{display:grid;gap:14px;margin-top:30px}
.nopin .phase-list .phase{display:block;min-height:0;margin:0;padding:20px 20px 22px;border-inline-start:1px solid var(--rose);background:rgba(255,255,255,.035)}
.nopin .g-now{display:none}

/* worries */
.worries{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:52px}
.worry{position:relative;min-height:232px;background:var(--white);border:none;text-align:start;cursor:pointer;padding:0;overflow:hidden;perspective:900px}
.worry .f{position:absolute;inset:0;padding:24px 24px 22px;display:flex;flex-direction:column;transition:transform .75s var(--ease),opacity .5s}
.worry .q{background:var(--white)}
.worry .a{background:var(--charcoal);color:var(--sand);transform:translateY(101%)}
.worry .num{font-family:var(--serif);font-size:15px;color:var(--copper);font-variant-numeric:lining-nums tabular-nums}
.worry .q h3{font-family:var(--serif);font-size:25px;line-height:1.22;margin-top:auto;color:var(--graphite)}
html[dir="rtl"] .worry .q h3{font-family:var(--ar-display);font-weight:300;line-height:1.5;font-size:23px}
.worry .q small{display:block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cap)}
html[dir="rtl"] .worry .q small{letter-spacing:0;font-size:13px}
.worry .a .k{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .worry .a .k{letter-spacing:0;font-size:13px}
.worry .a p{margin-top:auto;font-size:15.5px;font-weight:300;line-height:1.5}
html[dir="rtl"] .worry .a p{font-weight:400;font-size:16px;line-height:1.75}
.worry.open .q{transform:translateY(-101%)}
.worry.open .a{transform:none}
@media(hover:hover){.worry:hover .q{transform:translateY(-101%)}.worry:hover .a{transform:none}}

/* roles */
.asks{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:52px}
.ask{border-inline-start:2px solid var(--stone);padding-inline-start:20px}
.ask b{display:block;font-family:var(--serif);font-size:64px;line-height:1;color:var(--copper);font-weight:400}
.ask h3{font-size:17px;font-weight:700;margin-top:12px}
html[dir="rtl"] .ask h3{font-family:var(--ar-display);font-weight:500;font-size:18px}
.ask p{font-size:14.5px;font-weight:300;margin-top:6px}
html[dir="rtl"] .ask p{font-weight:400;font-size:15.5px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:52px}
.role{background:var(--white);padding:28px 28px 26px;border-top:2px solid var(--copper)}
.role.alt{border-top-color:var(--stone)}
.role h3{font-family:var(--serif);font-size:22px}
html[dir="rtl"] .role h3{font-family:var(--ar-display);font-weight:400;font-size:21px}
.role ul{list-style:none;margin-top:14px;display:grid;gap:8px}
.role li{position:relative;padding-inline-start:18px;font-size:15px;font-weight:300}
html[dir="rtl"] .role li{font-weight:400;font-size:16px}
.role li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:9px;height:1px;background:var(--copper)}

/* estimator */
.est{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;margin-top:52px;align-items:start}
.est-in{display:grid;gap:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid rgba(200,193,178,.45);background:none;color:var(--sand);font-size:13px;font-weight:700;padding:8px 14px;border-radius:40px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
html[dir="rtl"] .pill{font-size:14.5px;font-weight:500}
.pill:hover{border-color:var(--rose);color:var(--rose)}
.pill[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff}
.fld label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--stone)}
html[dir="rtl"] .fld label{font-size:15px}
.fld .val{display:flex;align-items:baseline;gap:6px;color:var(--white);font-family:var(--serif);font-size:22px}
.fld .val input{width:84px;background:none;border:none;border-bottom:1px solid rgba(200,193,178,.5);color:var(--white);font-family:var(--serif);font-size:22px;text-align:end;padding:0 2px;-moz-appearance:textfield;font-variant-numeric:lining-nums tabular-nums}
.fld .val input::-webkit-outer-spin-button,.fld .val input::-webkit-inner-spin-button{-webkit-appearance:none}
.fld .val small{font-family:var(--sans);font-size:12px;color:var(--stone)}
html[dir="rtl"] .fld .val small{font-family:var(--ar-body);font-size:13.5px}
.fld .hint{font-size:12px;color:var(--mist);margin-top:6px}
html[dir="rtl"] .fld .hint{font-size:13.5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin-top:8px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--rose) var(--pc,50%),rgba(200,193,178,.3) var(--pc,50%))}
html[dir="rtl"] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(270deg,var(--rose) var(--pc,50%),rgba(200,193,178,.3) var(--pc,50%))}
input[type=range]::-moz-range-track{height:2px;background:rgba(200,193,178,.3)}
input[type=range]::-moz-range-progress{height:2px;background:var(--rose)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--rose);border:3px solid var(--charcoal);box-shadow:0 0 0 1px var(--rose);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--rose);border:3px solid var(--charcoal);box-shadow:0 0 0 1px var(--rose)}
.light input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--copper) var(--pc,50%),var(--stone) var(--pc,50%))}
html[dir="rtl"] .light input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(270deg,var(--copper) var(--pc,50%),var(--stone) var(--pc,50%))}
.light input[type=range]::-webkit-slider-thumb{background:var(--copper);border-color:var(--sand);box-shadow:0 0 0 1px var(--copper)}
.light input[type=range]::-moz-range-thumb{background:var(--copper);border-color:var(--sand);box-shadow:0 0 0 1px var(--copper)}
.light input[type=range]::-moz-range-track{background:var(--stone)}
.light input[type=range]::-moz-range-progress{background:var(--copper)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(200,193,178,.45);border-radius:2px;margin-top:8px}
.seg button{background:none;border:none;color:var(--stone);padding:10px 8px;font-size:13px;font-weight:700;cursor:pointer;transition:background .25s,color .25s}
html[dir="rtl"] .seg button{font-size:14.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--sand);color:var(--charcoal)}
.est-out{background:rgba(255,255,255,.04);border:1px solid rgba(200,193,178,.22);padding:30px 30px 26px}
.bars{display:grid;gap:22px}
.barrow h4{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
html[dir="rtl"] .barrow h4{letter-spacing:0;font-size:13px}
.barrow h4 em{font-style:normal;color:var(--white);letter-spacing:0;font-size:13px;text-transform:none}
.sbar{display:flex;height:44px;margin-top:8px;background:rgba(200,193,178,.12);overflow:hidden}
.sbar i{display:block;height:100%;flex:0 0 auto;width:0;transition:width .7s var(--ease)}
.c-land{background:var(--stone)}.c-eq{background:var(--copper)}.c-fin{background:var(--rose)}.c-build{background:#8D8780}.c-soft{background:var(--bronze)}
.lg{list-style:none;margin-top:10px;display:grid;gap:5px}
.lg li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-size:13.5px;color:var(--sand)}
html[dir="rtl"] .lg li{font-size:15px}
.lg li.off{display:none}
.lg i{width:12px;height:12px}
.lg b{font-weight:700;color:var(--white);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.lg em{font-style:normal;color:var(--stone);font-size:12.5px;min-width:38px;text-align:end;font-variant-numeric:lining-nums tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(200,193,178,.3)}
.key{border-inline-start:2px solid var(--rose);padding-inline-start:14px}
.key b{display:block;font-family:var(--serif);font-size:30px;line-height:1.05;color:var(--white);font-weight:400;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.key b small{font-family:var(--sans);font-size:12px;color:var(--stone);margin-inline-start:4px}
html[dir="rtl"] .key b small{font-family:var(--ar-body);font-size:13px}
.key span{display:block;font-size:12px;color:var(--stone);margin-top:7px;line-height:1.35}
html[dir="rtl"] .key span{font-size:13.5px;line-height:1.6}
.est-say{margin-top:22px;font-family:var(--serif);font-size:18px;line-height:1.4;color:var(--white)}
html[dir="rtl"] .est-say{font-family:var(--ar-display);font-weight:300;line-height:1.7;font-size:17.5px}
.est-say b{font-weight:400;color:var(--rose);font-style:italic}
html[dir="rtl"] .est-say b{font-style:normal;font-weight:500}
.est-act{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.est-act .btn{padding:12px 20px;font-size:13px}
html[dir="rtl"] .est-act .btn{font-size:15px}

/* offer */
.offer{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:52px;align-items:center}
.gives{list-style:none;display:grid;border-top:1px solid var(--stone)}
.gives li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--stone);font-size:15.5px}
html[dir="rtl"] .gives li{font-size:16.5px}
.gives svg{width:20px;height:20px;stroke:var(--copper);fill:none;stroke-width:1.6;margin-top:3px;stroke-linecap:round;stroke-linejoin:round}
.gets{margin-top:26px;background:var(--charcoal);color:var(--sand);padding:26px 28px}
.gets .k{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
html[dir="rtl"] .gets .k{letter-spacing:0;font-size:13px}
.gets p{font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--white);margin-top:8px}
html[dir="rtl"] .gets p{font-family:var(--ar-display);font-weight:300;line-height:1.7;font-size:19px}
.align{background:var(--paper);padding:30px 30px 26px;border-top:2px solid var(--copper)}
.align h3{font-family:var(--serif);font-size:22px}
html[dir="rtl"] .align h3{font-family:var(--ar-display);font-weight:400;font-size:21px}
.abars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:230px;align-items:end;margin-top:22px;border-bottom:1px solid var(--graphite)}
.abar{position:relative;height:100%;display:flex;align-items:flex-end}
.abar i{display:block;width:100%;height:calc(var(--h)*1%);background:var(--copper);transition:height .5s var(--ease)}
.abar.aw i{background:linear-gradient(180deg,var(--rose),var(--copper))}
.abar.you i{background:var(--graphite)}
.abar.feeb i{background:var(--stone)}
.alabels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.alabels span{font-size:13px;font-weight:700;line-height:1.3}
html[dir="rtl"] .alabels span{font-size:14.5px;font-weight:500;line-height:1.5}
.alabels small{display:block;font-weight:400;color:var(--cap);font-size:12px;margin-top:2px}
html[dir="rtl"] .alabels small{font-size:13px}
.align .fld{margin-top:22px}
.align .fld label{color:var(--cap)}
.align .say2{margin-top:12px;font-size:14.5px;min-height:3.2em}
html[dir="rtl"] .align .say2{font-size:15.5px;min-height:3.6em}

/* next step */
.flow4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;position:relative}
.flow4::before{content:"";position:absolute;top:20px;inset-inline:20px;height:1px;background:rgba(200,193,178,.35)}
.flow4::after{content:"";position:absolute;top:20px;inset-inline-start:20px;height:1px;width:calc(100% - 40px);background:var(--rose);transform:scaleX(0);transform-origin:left;transition:transform 2s var(--ease) .2s}
html[dir="rtl"] .flow4::after{transform-origin:right}
.flow4.in::after{transform:scaleX(1)}
.fs{position:relative;padding-inline-end:22px}
.fs .dot{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--charcoal);border:1px solid var(--rose);color:var(--rose);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;font-family:var(--sans);transition:background .5s,color .5s;transition-delay:calc(var(--i)*450ms + 300ms)}
.flow4.in .fs .dot{background:var(--copper);border-color:var(--copper);color:#fff}
.fs h3{font-size:16.5px;font-weight:700;color:var(--white);margin-top:18px}
html[dir="rtl"] .fs h3{font-family:var(--ar-display);font-weight:500;font-size:17.5px}
.fs p{font-size:14px;font-weight:300;color:var(--sand);margin-top:6px}
html[dir="rtl"] .fs p{font-weight:400;font-size:15px}
.final{margin-top:64px;padding-top:40px;border-top:1px solid rgba(200,193,178,.3);display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end}
.final h3{font-family:var(--serif);font-size:clamp(26px,3vw,38px);line-height:1.2;color:var(--white)}
.final h3 em{font-style:italic;color:var(--rose);display:block}
html[dir="rtl"] .final h3{font-family:var(--ar-display);font-weight:300;line-height:1.5}
html[dir="rtl"] .final h3 em{font-style:normal;font-weight:400}
.final p{font-size:15px;font-weight:300;color:var(--sand);margin-top:12px;max-width:52ch}
html[dir="rtl"] .final p{font-weight:400;font-size:16px}
.final .reach{display:grid;gap:10px;justify-items:start}
.final .reach a.t{color:var(--stone);text-decoration:none;font-size:15px;border-bottom:1px solid rgba(200,193,178,.4)}
.final .reach a.t:hover{color:var(--white);border-color:var(--rose)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* notice + footer */
.notice{background:var(--paper);padding:44px 0;border-top:1px solid var(--stone)}
.notice p{font-size:12.5px;color:var(--cap);max-width:none;margin-top:10px}
html[dir="rtl"] .notice p{font-size:14px}
footer{background:var(--charcoal);color:var(--mist);padding:56px 0 40px;font-size:13px}
html[dir="rtl"] footer{font-size:14.5px}
footer .ftop{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start}
footer img{height:42px;width:auto}
footer .contact{display:grid;gap:4px}
footer .contact b{color:var(--sand);font-weight:700;margin-bottom:4px}
footer a{color:var(--stone);text-decoration:none;border-bottom:1px solid rgba(200,193,178,.4)}
footer a:hover{color:var(--white);border-bottom-color:var(--rose)}
footer .disclosure{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:36px;padding-top:16px;border-top:1px solid rgba(200,193,178,.25);font-size:12px}
html[dir="rtl"] footer .disclosure{font-size:13.5px}

/* responsive */
@media(max-width:1100px){
  .top nav{display:none}
  .top .hbtn{margin-inline-start:auto}
}
@media(max-width:959px){
  section{padding:76px 0}
  .hero{padding-bottom:110px}
  .hero-grid,.two,.tl,.tools,.est,.offer,.final,.tpanel{grid-template-columns:1fr}
  .hero-grid{gap:20px}
  .stack svg{max-width:400px;margin-inline:auto}
  .stats .wrap{grid-template-columns:1fr 1fr;gap:28px 22px}
  .types{grid-template-columns:1fr 1fr}
  .tpanel{gap:26px;padding:26px 22px}
  .two{gap:34px}
  .pillars{grid-template-columns:1fr 1fr}
  .tdet{position:static;padding:28px 22px}
  .worries{grid-template-columns:1fr 1fr}
  .asks{grid-template-columns:1fr;gap:26px}
  .roles{grid-template-columns:1fr}
  .flow4{grid-template-columns:1fr 1fr;gap:34px 0}
  .flow4::before,.flow4::after{display:none}
  .tl{gap:30px}
}
@media(max-width:600px){
  .wrap{padding:0 18px}
  .top{padding:0 16px;gap:10px}
  .top .logo{height:42px}
  .top .hbtn{display:none}
  .lang-btn{margin-inline-start:auto}
  .types{gap:10px}
  .type{padding:14px 14px 12px}
  .type h3{font-size:18px}
  .worries{grid-template-columns:1fr}
  .worry{min-height:236px}
  .meters,.facts{grid-template-columns:1fr}
  .keys{grid-template-columns:1fr;gap:14px}
  .str-row.r1{grid-template-columns:1fr 1fr}
  .bus.b1 .d2,.bus.b1 .d3{display:none}
  .bus.b1 .d1{inset-inline-start:25%}.bus.b1 .d4{inset-inline-start:75%}
  .bus.b1 .h{inset-inline:25%}
  .g-grid{grid-template-columns:1fr}
  .g-sp{display:none}
  .g-lbl{padding:10px 0 2px}
  .gantt{padding:16px 14px}
  .g-weeks span:nth-child(even){visibility:hidden}
  .g-months span{font-size:9.5px;padding-inline-start:4px}
  .est-out{padding:22px 18px}
  .abars{height:180px}
  .pillars{grid-template-columns:1fr}
  .fs{padding-inline-end:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
  .js [data-r]{opacity:1;transform:none}
}
@media print{
  .top,.prog,.brandline a{display:none}
  .js [data-r]{opacity:1 !important;transform:none !important}
  .pin-track{height:auto !important}.pin-stick{position:static;height:auto;padding:40px 0}
}
</style>

      <h2 class="hl" data-en='Not an adviser on commission. <em>A co-investor.</em>' data-ar='لسنا مستشارًا بعمولة. <em>نحن شريك مستثمر.</em>'></h2>
      <ol class="steps" id="whySteps">
        <li><h3 data-en="Most advisers sit in the middle" data-ar="معظم المستشارين يجلسون في المنتصف"></h3><p><span data-en="A fee from one side, a commission from the other. Their interest ends the day you sign." data-ar="أتعاب من طرف وعمولة من الطرف الآخر – وتنتهي مصلحتهم يوم التوقيع."></span></p></li>
        <li><h3 data-en="We sit on your side" data-ar="نحن نجلس في صفّك"></h3><p><span data-en="Awraq invests in your project and holds its equity. We are real estate investors ourselves, so we read your project the way an owner does." data-ar="تستثمر أوراق في مشروعك وتملك حصة فيه. نحن مستثمرون عقاريون في الأصل – فنقرأ مشروعك بعين المالك."></span></p></li>
        <li><h3 data-en="And we bring the whole market to you" data-ar="ونجلب لك السوق كله"></h3><p><span data-en="We represent no bank, fund or financial adviser, so there is no conflict of interest. Local and global investors and financiers compete for your project, and you see every offer." data-ar="لا نمثّل بنكًا ولا صندوقًا ولا مستشارًا ماليًا – فلا تعارض في المصالح. يتنافس المستثمرون والممولون المحليون والعالميون على مشروعك، وتطّلع على كل عرض."></span></p></li>

      if (r.top < vh && r.bottom > 0) mq.style.transform = 'translateX(' + ((lang === 'ar' ? 1 : -1) * (vh - r.top) * 0.4) + 'px)';
    }
    pins.forEach(function (p) {
      if (p.sec.classList.contains('nopin')) {
        if (p.step !== p.n - 1) setStep(p, p.n - 1, 1);
        if (p.sec.id === 'timeline') setWeek(18);
        return;
      }
      var r = p.track.getBoundingClientRect(), span = r.height - vh;
      if (r.top > vh * 0.55) { setStep(p, -1, 0); return; }
      var pr = clamp(-r.top / span, 0, 0.9999), f = pr * p.n, st = Math.floor(f);
      setStep(p, st, f - st);
    });
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  window.addEventListener('resize', function () { vh = window.innerHeight; fitRot($('#rot span')); layoutPins(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitRot($('#rot span')); });
  if (pinMQ.addEventListener) pinMQ.addEventListener('change', layoutPins);

  applyLang();
  layoutPins();
})();
</script>
